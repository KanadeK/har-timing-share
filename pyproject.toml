[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "har-timing-share"
version = "0.1.0"
description = "Share performance-only HAR projections without carrying captured text."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
keywords = ["har", "performance", "privacy", "waterfall", "offline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
har-timing-share = "har_timing_share.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/har-timing-share"
Issues = "https://github.com/KanadeK/har-timing-share/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
